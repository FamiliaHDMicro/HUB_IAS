<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛋️ Sala VIP | OmniHub HDMicro</title>
    <style>
        :root { 
            --bg: #0f172a; /* Azul Escuro Profundo */
            --panel: #1e293b; /* Painel Cinza Azulado */
            --text: #e2e8f0; /* Texto Claro */
            --accent: #38bdf8; /* Azul Céu (Destaque) */
            --user-color: #4ade80; /* Verde (Usuário) */
            --ai-qwen: #c084fc; /* Roxo (Qwen) */
            --ai-claude: #fb923c; /* Laranja (Claude) */
            --ai-gemini: #60a5fa; /* Azul (Gemini) */
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER */
        header { 
            background: var(--panel); padding: 15px 20px; border-bottom: 1px solid var(--border); 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .brand { font-size: 1.2rem; font-weight: bold; color: var(--accent); display: flex; gap: 10px; align-items: center; }
        .status { font-size: 0.8rem; color: #94a3b8; background: rgba(56, 189, 248, 0.1); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--accent); }

        /* CONTAINER PRINCIPAL */
        main { flex: 1; display: flex; overflow: hidden; }

        /* SIDEBAR DE CONVIDADOS */
        aside { 
            width: 250px; background: var(--panel); border-right: 1px solid var(--border); 
            padding: 15px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto;
        }
        .aside-title { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; margin-bottom: 10px; }
        
        .guest-card { 
            background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; cursor: pointer; 
            transition: 0.2s; border-left: 4px solid transparent; display: flex; align-items: center; gap: 10px;
        }
        .guest-card:hover { background: rgba(255,255,255,0.1); }
        .guest-card.active { background: rgba(56, 189, 248, 0.1); border-left-color: var(--accent); }
        
        .avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.8rem; color: white; }
        .av-user { background: var(--user-color); }
        .av-qwen { background: var(--ai-qwen); }
        .av-claude { background: var(--ai-claude); }
        .av-gemini { background: var(--ai-gemini); }
        .av-other { background: #64748b; }

        .guest-info h4 { font-size: 0.9rem; color: var(--text); }
        .guest-info p { font-size: 0.75rem; color: #94a3b8; }

        /* ÁREA DO CHAT */
        .chat-area { flex: 1; display: flex; flex-direction: column; position: relative; }
        
        .messages-container { 
            flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; 
            scroll-behavior: smooth;
        }
        
        /* BALÕES DE MENSAGEM */
        .msg-wrapper { display: flex; gap: 10px; max-width: 85%; animation: fadeIn 0.3s ease; }
        .msg-wrapper.right { align-self: flex-end; flex-direction: row-reverse; }
        
        .msg-bubble { 
            padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); word-wrap: break-word;
        }
        .msg-meta { font-size: 0.7rem; opacity: 0.7; margin-top: 5px; display: block; }
        
        /* Estilos por Remetente */
        .bubble-user { background: var(--user-color); color: #064e3b; border-bottom-right-radius: 2px; }
        .bubble-qwen { background: var(--ai-qwen); color: #fff; border-bottom-left-radius: 2px; }
        .bubble-claude { background: var(--ai-claude); color: #fff; border-bottom-left-radius: 2px; }
        .bubble-gemini { background: var(--ai-gemini); color: #fff; border-bottom-left-radius: 2px; }
        .bubble-system { background: var(--border); color: #cbd5e1; font-style: italic; text-align: center; align-self: center; max-width: 100%; border-radius: 20px; padding: 5px 15px; font-size: 0.8rem;}

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* INPUT AREA */
        .input-zone { 
            background: var(--panel); padding: 15px 20px; border-top: 1px solid var(--border); 
            display: flex; gap: 10px; align-items: flex-end;
        }
        textarea { 
            flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text); 
            padding: 12px; border-radius: 8px; resize: none; outline: none; font-family: inherit; min-height: 50px; max-height: 150px;
        }
        textarea:focus { border-color: var(--accent); }
        
        .controls { display: flex; flex-direction: column; gap: 5px; }
        button.send-btn { 
            background: var(--accent); color: #0f172a; border: none; padding: 12px 20px; 
            border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button.send-btn:hover { filter: brightness(1.1); }
        
        select.sender-select { 
            background: var(--bg); color: var(--text); border: 1px solid var(--border); 
            padding: 8px; border-radius: 6px; font-size: 0.85rem; width: 100%;
        }

        /* FERRAMENTAS EXTRAS */
        .tools-bar { padding: 10px 20px; background: rgba(0,0,0,0.2); display: flex; gap: 10px; justify-content: flex-end; }
        .tool-btn { background: transparent; border: 1px solid var(--border); color: #94a3b8; padding: 5px 10px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; }
        .tool-btn:hover { color: var(--text); border-color: var(--text); }

    </style>
</head>
<body>

<header>
    <div class="brand">🛋️ Sala VIP <span style="font-size:0.8rem; opacity:0.7;">| Convite Aberto</span></div>
    <div class="status">Local Storage Ativo • Sem Custo</div>
</header>

<main>
    <!-- SIDEBAR: QUEM ESTÁ NA SALA -->
    <aside id="guestList">
        <div class="aside-title">Convidados Presentes</div>
        <!-- Gerado via JS -->
    </aside>

    <!-- CHAT PRINCIPAL -->
    <section class="chat-area">
        <div class="tools-bar">
            <button class="tool-btn" onclick="exportChat()">📥 Exportar JSON</button>
            <button class="tool-btn" onclick="clearChat()">🗑️ Limpar Tela</button>
        </div>
        
        <div class="messages-container" id="chatLog">
            <div class="msg-wrapper">
                <div class="msg-bubble bubble-system">
                    Bem-vindo à Sala VIP. Selecione quem vai falar abaixo. Cole respostas de IAs externas aqui para registrar o histórico.
                </div>
            </div>
        </div>

        <div class="input-zone">
            <div style="flex:1; display:flex; flex-direction:column; gap:5px;">
                <select id="senderSelect" class="sender-select">
                    <option value="user">👤 Eu (HDMicro)</option>
                    <option value="qwen">🧠 Qwen (Colar Resposta)</option>
                    <option value="claude">🟠 Claude (Colar Resposta)</option>
                    <option value="gemini">🔵 Gemini (Colar Resposta)</option>
                    <option value="other">🤖 Outra IA / Convidado</option>
                </select>
                <textarea id="msgInput" placeholder="Digite sua mensagem ou cole a resposta da IA selecionada..." onkeydown="handleKey(event)"></textarea>
            </div>
            <div class="controls">
                <button class="send-btn" onclick="sendMessage()">Enviar ➤</button>
            </div>
        </div>
    </section>
</main>

<script>
// ============ ESTADO E CONFIGURAÇÃO ============
const STORAGE_KEY = 'omnihub_sala_vip_history';
let messages = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
let currentSender = 'user';

// Definição dos Avatares e Cores
const AVATARS = {
    user: { name: 'Eu', class: 'av-user', icon: 'HD' },
    qwen: { name: 'Qwen', class: 'av-qwen', icon: 'Qw' },
    claude: { name: 'Claude', class: 'av-claude', icon: 'Cl' },
    gemini: { name: 'Gemini', class: 'av-gemini', icon: 'Ge' },
    other: { name: 'Outro', class: 'av-other', icon: '?' }
};

// ============ INICIALIZAÇÃO ============
document.addEventListener('DOMContentLoaded', () => {
    renderGuestSidebar();
    renderMessages();
    
    // Sincroniza seleção inicial
    document.getElementById('senderSelect').addEventListener('change', (e) => {
        currentSender = e.target.value;
    });
});

// ============ RENDERIZAÇÃO DA SIDEBAR ============
function renderGuestSidebar() {
    const list = document.getElementById('guestList');
    list.innerHTML = '<div class="aside-title">Convidados Presentes</div>';
    
    Object.keys(AVATARS).forEach(key => {
        const data = AVATARS[key];
        const isActive = key === currentSender ? 'active' : '';
        list.innerHTML += `
            <div class="guest-card ${isActive}" onclick="setActiveSender('${key}')">
                <div class="avatar ${data.class}">${data.icon}</div>
                <div class="guest-info">
                    <h4>${data.name}</h4>
                    <p>${key === 'user' ? 'Administrador' : 'IA Convidada'}</p>
                </div>
            </div>
        `;
    });
}

function setActiveSender(key) {
    currentSender = key;
    document.getElementById('senderSelect').value = key;
    renderGuestSidebar(); // Atualiza destaque visual
    document.getElementById('msgInput').focus();
}

// ============ GESTÃO DE MENSAGENS ============
function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;

    const newMsg = {
        id: Date.now(),
        sender: currentSender,
        text: text,
        timestamp: new Date().toISOString()
    };

    messages.push(newMsg);
    saveToStorage();
    renderSingleMessage(newMsg);
    input.value = '';
    scrollToBottom();
}

function renderMessages() {
    const container = document.getElementById('chatLog');
    container.innerHTML = ''; // Limpa antes de re-renderizar tudo (para carregamento inicial)
    
    if (messages.length === 0) {
         container.innerHTML = `<div class="msg-wrapper"><div class="msg-bubble bubble-system">Nenhuma mensagem ainda. Comece a conversar!</div></div>`;
         return;
    }

    messages.forEach(msg => renderSingleMessage(msg));
    scrollToBottom();
}

function renderSingleMessage(msg) {
    const container = document.getElementById('chatLog');
    const avatarData = AVATARS[msg.sender] || AVATARS.other;
    const isUser = msg.sender === 'user';
    const alignmentClass = isUser ? 'right' : 'left';
    const bubbleClass = `bubble-${msg.sender}`;
    
    const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    const wrapper = document.createElement('div');
    wrapper.className = `msg-wrapper ${alignmentClass}`;
    wrapper.innerHTML = `
        <div class="avatar ${avatarData.class}" style="width:24px;height:24px;font-size:0.6rem;margin-top:5px;">${avatarData.icon}</div>
        <div class="msg-bubble ${bubbleClass}">
            ${escapeHtml(msg.text)}
            <span class="msg-meta">${avatarData.name} • ${timeStr}</span>
        </div>
    `;
    container.appendChild(wrapper);
}

// ============ UTILITÁRIOS ============
function saveToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
}

function clearChat() {
    if(confirm("Tem certeza que deseja apagar todo o histórico desta sala?")) {
        messages = [];
        saveToStorage();
        renderMessages();
    }
}

function exportChat() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(messages, null, 2));
    const downloadAnchorNode = document.createElement('a');
    downloadAnchorNode.setAttribute("href", dataStr);
    downloadAnchorNode.setAttribute("download", `sala_vip_backup_${new Date().toISOString().slice(0,10)}.json`);
    document.body.appendChild(downloadAnchorNode);
    downloadAnchorNode.click();
    downloadAnchorNode.remove();
}

function escapeHtml(text) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return text.replace(/[&<>"']/g, function(m) { return map[m]; });
}

function scrollToBottom() {
    const container = document.getElementById('chatLog');
    container.scrollTop = container.scrollHeight;
}

function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}
</script>
</body>
</html>
