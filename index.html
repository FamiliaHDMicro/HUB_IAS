<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDMicro Hub | Ferramentas para Quem Constrói</title>
    <style>
        :root { --bg: #f4f7f6; --card: #ffffff; --text: #2c3e50; --accent: #1e8449; --gray: #7f8c8d; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.6; }
        
        /* HEADER */
        header { background: var(--accent); color: white; padding: 20px; text-align: center; }
        header h1 { font-size: 1.5rem; margin-bottom: 5px; }
        header p { font-size: 0.9rem; opacity: 0.9; }

        /* GRID DE PRODUTOS */
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        
        /* CARD DO APP */
        .app-card { 
            background: var(--card); border-radius: 12px; overflow: hidden; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s;
            display: flex; flex-direction: column; height: 100%;
        }
        .app-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        
        .app-header { padding: 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; }
        .app-icon { font-size: 2rem; }
        .app-title { font-weight: bold; font-size: 1.1rem; color: var(--accent); }
        
        .app-body { padding: 15px; flex: 1; }
        .app-desc { font-size: 0.9rem; color: var(--gray); margin-bottom: 15px; }
        
        .app-footer { padding: 15px; background: #fafafa; border-top: 1px solid #eee; }
        
        /* BOTÕES DE AÇÃO */
        .btn-web, .btn-download { 
            width: 100%; padding: 12px; border: none; border-radius: 6px; 
            font-weight: bold; cursor: pointer; text-align: center; text-decoration: none;
            display: block; margin-bottom: 8px; transition: 0.2s;
        }
        .btn-web { background: var(--accent); color: white; }
        .btn-web:hover { background: #145a32; }
        
        .btn-download { background: #34495e; color: white; }
        .btn-download:hover { background: #2c3e50; }

        .tag { font-size: 0.7rem; background: #eee; color: #555; padding: 2px 6px; border-radius: 4px; margin-right: 5px; }
        
        footer { text-align: center; padding: 20px; font-size: 0.8rem; color: var(--gray); margin-top: 40px; }
    </style>
</head>
<body>

<header>
    <h1>🛡️ HDMicro Hub</h1>
    <p>Ferramentas leves, gratuitas e dignas para autônomos e criadores.</p>
</header>

<div class="container">
    <div class="grid" id="appsGrid">
        <!-- Os cards serão gerados via JavaScript abaixo -->
    </div>
</div>

<footer>
    © 2026 FamiliaHDMicro | Feito com ❤️ e Hardware Limitado.<br>
    Apoie o projeto: <a href="https://mpago.la/2zbECPA" style="color:var(--accent); font-weight:bold;">R$ 9,00 Vitalício</a>
</footer>

<script>
// ============ BANCO DE DADOS LOCAL DOS APPS ============
// Edite esta lista conforme você adiciona novos projetos.
const APPS_LIST = [
    {
        id: 'recibo-certo',
        icon: '📝',
        title: 'Recibo Certo',
        desc: 'Gere recibos digitais e orçamentos em 30 segundos. Envie direto no WhatsApp do cliente.',
        tags: ['Web App', 'Autônomo', 'Grátis'],
        type: 'web', // Abre link
        url: 'https://recibo-certo.pages.dev' // Substitua pelo link real quando subir
    },
    {
        id: 'salavip',
        icon: '🛋️',
        title: 'Sala VIP (Registro IA)',
        desc: 'Organize suas conversas com IAs (Qwen, Claude, Gemini). Cole respostas e crie histórico visual.',
        tags: ['Web App', 'Produtividade'],
        type: 'web',
        url: 'https://sala-vip-hdmicro.pages.dev' // Substitua pelo link real
    },
    {
        id: 'criador-universal',
        icon: '⚡',
        title: 'Criador Universal Offline',
        desc: 'Editor de código sandbox. Gere scripts Python, HTML, BAT sem internet. Seguro e rápido.',
        tags: ['Download', 'Dev Tool'],
        type: 'download', // Baixa arquivo
        file_url: './criador_universal.html', // Caminho relativo se estiver hospedado junto
        filename: 'criador_universal.html'
    },
    {
        id: 'admin-panel',
        icon: '🧠',
        title: 'Painel Admin Curador',
        desc: 'Gerencie seus arquivos locais e registre metadados no banco D1 da Cloudflare.',
        tags: ['Download', 'Admin'],
        type: 'download',
        file_url: './admin.html',
        filename: 'admin.html'
    }
];

// ============ RENDERIZAÇÃO DA VITRINE ============
function renderApps() {
    const grid = document.getElementById('appsGrid');
    
    if(APPS_LIST.length === 0) {
        grid.innerHTML = '<p>Nenhum app cadastrado ainda.</p>';
        return;
    }

    grid.innerHTML = APPS_LIST.map(app => `
        <div class="app-card">
            <div class="app-header">
                <span class="app-icon">${app.icon}</span>
                <span class="app-title">${app.title}</span>
            </div>
            <div class="app-body">
                <p class="app-desc">${app.desc}</p>
                <div style="margin-top:10px;">
                    ${app.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                </div>
            </div>
            <div class="app-footer">
                ${app.type === 'web' ? 
                    `<a href="${app.url}" target="_blank" class="btn-web">🚀 Abrir App Online</a>` :
                    `<a href="${app.file_url}" download="${app.filename}" class="btn-download">💾 Baixar Arquivo</a>`
                }
            </div>
        </div>
    `).join('');
}

// Inicializa ao carregar
document.addEventListener('DOMContentLoaded', renderApps);
</script>

</body>
</html>
