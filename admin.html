<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniHub Admin | Curadoria HDMicro</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --text: #c9d1d9; --accent: #58a6ff; --border: #30363d; --green: #238636; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        /* HEADER & TOKEN */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        h1 { margin: 0; font-size: 1.4rem; }
        .token-box { display: flex; gap: 10px; }
        input[type="password"] { background: #0d1117; border: 1px solid var(--border); color: white; padding: 8px; border-radius: 4px; width: 200px; }
        button { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        /* BUSCA LOCAL (Performance para Pentium) */
        .search-bar { margin-bottom: 20px; }
        .search-bar input { width: 100%; padding: 10px; background: var(--card); border: 1px solid var(--border); color: white; border-radius: 6px; font-size: 1rem; }
        
        /* ZONA DE UPLOAD */
        .upload-zone { 
            border: 2px dashed var(--border); border-radius: 12px; padding: 30px; text-align: center; 
            background: var(--card); transition: all 0.3s; margin-bottom: 20px; cursor: pointer;
        }
        .upload-zone:hover, .upload-zone.dragover { border-color: var(--accent); background: rgba(88, 166, 255, 0.05); }
        .upload-zone h2 { margin: 0 0 10px 0; color: var(--accent); font-size: 1.1rem; }
        .upload-zone p { margin: 0; opacity: 0.7; font-size: 0.85rem; }
        #fileInput { display: none; }
        
        /* STATS */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: var(--card); padding: 10px; border-radius: 6px; text-align: center; border-left: 3px solid var(--accent); }
        .stat-card .val { font-size: 1.5rem; font-weight: bold; display: block; }
        .stat-card .lbl { font-size: 0.75rem; opacity: 0.7; text-transform: uppercase; }
        
        /* LISTA DE PROJETOS */
        .project-list { display: grid; gap: 8px; }
        .proj-item { background: var(--card); padding: 12px 15px; border-radius: 6px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .proj-info { flex: 1; overflow: hidden; }
        .proj-name { font-weight: bold; color: var(--accent); white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        .proj-meta { font-size: 0.75rem; opacity: 0.6; margin-top: 2px; display: flex; gap: 10px; }
        .badge { padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; }
        
        /* TOAST */
        .toast { position: fixed; bottom: 20px; right: 20px; background: var(--card); border: 1px solid var(--border); padding: 12px 20px; border-radius: 8px; transform: translateY(100px); opacity: 0; transition: 0.3s; z-index: 100; }
        .toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>🧠 OmniHub Admin</h1>
        <div class="token-box">
            <input type="password" id="tokenInput" placeholder="ADMIN_TOKEN..." />
            <button onclick="saveToken()">Salvar</button>
        </div>
    </header>

    <!-- CAMPO MÁGICO DE UPLOAD -->
    <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <h2>☁️ Arraste suas "Loucuras" aqui</h2>
        <p>.py, .bat, .html, .js, .sql... Tudo vai direto pro D1 como "Criados"</p>
        <input type="file" id="fileInput" multiple onchange="handleFiles(this.files)">
    </div>

    <!-- BUSCA INSTANTÂNEA -->
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 Buscar projeto pelo nome ou tipo..." oninput="filterProjects()">
    </div>

    <!-- DASHBOARD -->
    <div class="stats" id="statsContainer">
        <div class="stat-card"><span class="val" id="countTotal">-</span><span class="lbl">Total</span></div>
        <div class="stat-card" style="border-color:#FFD700"><span class="val" id="countCriando">-</span><span class="lbl">Criando</span></div>
        <div class="stat-card" style="border-color:#2196F3"><span class="val" id="countEmUso">-</span><span class="lbl">Em Uso</span></div>
        <div class="stat-card" style="border-color:#4CAF50"><span class="val" id="countCriados">-</span><span class="lbl">Criados</span></div>
    </div>

    <div id="loading" style="text-align:center;padding:20px;opacity:0.5;display:none">Carregando acervo...</div>
    <div class="project-list" id="projectList"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://hub-ias.hdmicro-ml.workers.dev/api/projects';
let token = localStorage.getItem('omnihub_token') || '';
let allProjects = []; // Guarda tudo na memória para busca rápida

document.getElementById('tokenInput').value = token;

// --- AUTENTICAÇÃO ---
function saveToken() {
    const t = document.getElementById('tokenInput').value.trim();
    if(t) { localStorage.setItem('omnihub_token', t); token = t; showToast('✅ Token salvo!'); loadProjects(); }
}

// --- UPLOAD INTELIGENTE ---
const dropZone = document.getElementById('dropZone');
['dragenter','dragover'].forEach(e => dropZone.addEventListener(e, ev => { ev.preventDefault(); dropZone.classList.add('dragover'); }));
['dragleave','drop'].forEach(e => dropZone.addEventListener(e, ev => { ev.preventDefault(); dropZone.classList.remove('dragover'); }));
dropZone.addEventListener('drop', e => handleFiles(e.dataTransfer.files));

async function handleFiles(files) {
    if(!token) { alert('Salve o token primeiro!'); return; }
    let uploaded = 0;
    
    for(const file of files) {
        // Detecta extensão automaticamente
        const ext = '.' + file.name.split('.').pop().toLowerCase();
        const validExts = ['.py','.js','.html','.css','.bat','.ps1','.sql','.json','.md','.txt','.cs','.java'];
        if(!validExts.includes(ext)) continue;
        
        try {
            const resp = await fetch(API, {
                method: 'POST',
                headers: { 'Content-Type':'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({
                    name: file.name,
                    description: `Upload via Admin (${ext})`,
                    file_type: ext,          // Novo campo do schema
                    size_bytes: file.size,   // Novo campo do schema
                    status_label: 'Criados'
                })
            });
            const data = await resp.json();
            if(data.success) uploaded++;
        } catch(e) { console.error(e); }
    }
    
    if(uploaded > 0) {
        showToast(`☁️ ${uploaded} arquivo(s) enviado(s)!`);
        loadProjects(); // Recarrega lista
    } else {
        showToast('⚠️ Nenhum arquivo válido encontrado.', 'error');
    }
}

// --- CARREGAMENTO E FILTRO ---
async function loadProjects() {
    if(!token) return;
    document.getElementById('loading').style.display = 'block';
    
    try {
        const res = await fetch(API, { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        if(data.success) {
            allProjects = data.data; // Salva na memória RAM
            renderData(allProjects);
        }
    } catch(e) { showToast('Erro de conexão', 'error'); }
    finally { document.getElementById('loading').style.display = 'none'; }
}

function filterProjects() {
    const term = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allProjects.filter(p => 
        p.name.toLowerCase().includes(term) || 
        (p.file_type && p.file_type.includes(term))
    );
    renderData(filtered);
}

function renderData(projects) {
    // Atualiza Stats
    const counts = {'Criando':0,'Em Uso':0,'Criados':0};
    projects.forEach(p => { if(counts[p.status_label]!==undefined) counts[p.status_label]++; });
    
    document.getElementById('countTotal').innerText = projects.length;
    document.getElementById('countCriando').innerText = counts['Criando'];
    document.getElementById('countEmUso').innerText = counts['Em Uso'];
    document.getElementById('countCriados').innerText = counts['Criados'];
    
    // Renderiza Lista
    document.getElementById('projectList').innerHTML = projects.map(p => `
        <div class="proj-item">
            <div class="proj-info">
                <div class="proj-name">${p.name}</div>
                <div class="proj-meta">
                    <span>${p.file_type || '?'}</span>
                    <span>${formatBytes(p.size_bytes)}</span>
                    <span>${new Date(p.updated_at).toLocaleDateString()}</span>
                </div>
            </div>
            <span class="badge" style="background:${p.color_hex}20;color:${p.color_hex};border:1px solid ${p.color_hex}40">${p.status_label}</span>
        </div>
    `).join('');
}

function formatBytes(bytes) {
    if (!bytes || bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

function showToast(msg, type='success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.borderColor = type==='error' ? '#f85149' : '#238636';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

if(token) loadProjects();
</script>
</body>
</html>
